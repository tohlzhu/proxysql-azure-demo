[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ratelimit-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "redis>=5.2,<7",
  "aiomysql>=0.2,<1",
  "PyMySQL>=1.1,<2",
  "cryptography>=44,<50",
  "httpx>=0.28,<1",
  "PyYAML>=6,<7",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1", "playwright>=1.51,<2"]

[project.scripts]
ratelimit-demo = "ratelimit_demo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
